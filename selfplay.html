<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>육목 — 자율대국 모델 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="play.css?v=3">
<link rel="stylesheet" href="selfplay.css?v=3">
</head>
<body data-mode="self">
<header class="topbar">
  <a class="nav" href="index.html">← 메인</a>
  <span class="brand">육목</span><span class="tag">자율대국 · Greedy 모델 분석</span>
  <div class="controls">
    <span id="ai-badge" class="badge">모델 불러오는 중</span>
    <button id="new-game">새 판</button>
  </div>
</header>
<main class="stage">
  <div class="board-wrap">
    <canvas id="board" tabindex="0" aria-label="육목 자율대국 게임판"></canvas>
    <div class="result" id="result" hidden><div class="result-card"><h2 id="result-title"></h2><p id="result-detail"></p><button class="primary" id="result-new">새 판</button></div></div>
  </div>
  <aside class="rail">
    <div><p class="label">차례</p><div class="turn"><span id="turn-dot" class="dot"></span><span id="turn-text"></span></div></div>
    <div class="bank-grid"><div><p class="label">돌 창고</p><div id="bank-black" class="bankline"></div><div id="bank-white" class="bankline"></div></div><div><p class="label">이번 턴</p><div id="slots" class="slots"></div></div></div>
    <div id="recommend" class="recommend"></div>
    <div class="actions"><button id="undo">무르기</button><button class="primary" id="end-turn">턴 마치기</button></div>
    <p id="hint" class="hint"></p>

    <div class="analysis-head">
      <p class="label">Greedy 모델 분석</p><span class="spacer"></span>
      <div class="review-nav" aria-label="기보 탐색">
        <button id="kifu-first" title="처음">|◀</button>
        <button id="kifu-prev" title="이전">◀</button>
        <span id="kifu-pos">0 / 0</span>
        <button id="kifu-next" title="다음">▶</button>
        <button id="kifu-last" title="최신">▶|</button>
      </div>
    </div>
    <div id="analysis-meta" class="analysis-meta">모델 분석 준비 중…</div>
    <div class="analysis-layout">
      <div id="analysis-summary" class="analysis-summary"></div>
      <aside class="kifu-panel">
        <div class="kifu-title">기보</div>
        <div id="kifu-list" class="kifu-list"></div>
      </aside>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
</main>
<script src="engine.js?v=start-stones-1-2"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
  window.__selfplayRealOrtCreate = ort.InferenceSession.create.bind(ort.InferenceSession);
  ort.InferenceSession.create = (source, options) => {
    if (typeof source === 'string' && source.startsWith('sixmok.onnx')) {
      return Promise.resolve({ run: async () => { throw new Error('selfplay core-only session'); } });
    }
    return window.__selfplayRealOrtCreate(source, options);
  };
  var module = { exports: {} };
</script>
<script src="model.js?v=opening35-core-3"></script>
<script>
  window.SIXMOK_MODEL_CORE = module.exports;
  ort.InferenceSession.create = window.__selfplayRealOrtCreate;
</script>
<script src="model-inspector.js?v=3"></script>
<script src="selfplay-ui.js?v=3"></script>
<script src="selfplay-play.js?v=1"></script>
</body>
</html>
