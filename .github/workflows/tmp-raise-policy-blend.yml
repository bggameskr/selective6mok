name: Temporary policy blend patch

on:
  push:
    branches:
      - experiment/no-tactical-corrections
    paths:
      - .github/workflows/tmp-raise-policy-blend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/no-tactical-corrections
      - name: Raise policy blend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('model.js')
          text = path.read_text(encoding='utf-8')
          old = 'const POLICY_BLEND = 0.1;'
          new = 'const POLICY_BLEND = 0.5;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.js
          git commit -m "Raise web policy blend to 0.5"
          git push origin HEAD:experiment/no-tactical-corrections
