<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>육목 — 돌을 아껴 두는 오목</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101413;
    --field: #1a2321;
    --field-edge: #253230;
    --line: #3d524d;
    --paper: #ede7da;
    --paper-dim: #9aa6a1;
    --celadon: #86b8a8;
    --brass: #c89b3c;
    --rail: #151d1c;
    --radius: 10px;
    --font-display: 'Gowun Batang', serif;
    --font-ui: 'IBM Plex Sans KR', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------------------------------------------------------- 상단 바 */

  .topbar {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--field-edge);
    flex-wrap: wrap;
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0;
  }

  .tagline {
    font-size: 12px;
    color: var(--paper-dim);
    letter-spacing: 0.02em;
  }

  .topbar-controls {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 5px 9px;
    border-radius: 5px;
    border: 1px solid var(--field-edge);
    color: var(--paper-dim);
    white-space: nowrap;
  }

  .badge.model {
    border-color: var(--celadon);
    color: var(--celadon);
  }

  .badge.loading { border-style: dashed; }

  .badge.error {
    border-color: var(--brass);
    color: var(--brass);
  }

  select, button {
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--paper);
    background: transparent;
    border: 1px solid var(--field-edge);
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }

  select { font-family: var(--font-mono); }

  select:hover, button:hover:not(:disabled) { border-color: var(--celadon); }

  button:disabled { opacity: 0.35; cursor: not-allowed; }

  :focus-visible {
    outline: 2px solid var(--celadon);
    outline-offset: 2px;
  }

  /* ---------------------------------------------------------- 본문 배치 */

  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 272px;
    min-height: 0;
  }

  .board-wrap {
    position: relative;
    display: grid;
    place-items: center;
    padding: 18px;
    min-height: 0;
  }

  canvas {
    display: block;
    border-radius: var(--radius);
    touch-action: manipulation;
  }

  /* ---------------------------------------------------------- 돌 창고 */

  .rail {
    background: var(--rail);
    border-left: 1px solid var(--field-edge);
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 0;
  }

  .label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--paper-dim);
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .turn-line {
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .turn-dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 1px solid var(--line);
    flex: none;
  }

  .bank-line {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    min-height: 26px;
    padding: 3px 0;
  }

  .bank-line .who {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--paper-dim);
    width: 30px;
    flex: none;
  }

  .bank-line.active .who { color: var(--celadon); }
  .bank-line:not(.active) .token { opacity: 0.5; }

  .token {
    width: 22px; height: 22px;
    border-radius: 50%;
    flex: none;
    animation: drop 220ms ease-out;
  }

  .token.black { background: radial-gradient(circle at 34% 30%, #4a5350, #0d1110 70%); }
  .token.white { background: radial-gradient(circle at 34% 30%, #ffffff, #bdb5a4 72%); }

  .bank-count {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--paper-dim);
    margin-left: 2px;
  }

  .bank-count.ready { color: var(--brass); }

  .burst-note {
    font-size: 12px;
    color: var(--brass);
    margin: 8px 0 0;
    display: none;
  }

  .bank.burst .burst-note { display: block; }

  .slots { display: flex; gap: 6px; }

  .slot {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px dashed var(--line);
  }

  .slot.filled {
    border-style: solid;
    border-color: var(--celadon);
    background: color-mix(in srgb, var(--celadon) 26%, transparent);
  }

  .slot.locked { opacity: 0.3; }

  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; }

  .primary {
    background: var(--celadon);
    border-color: var(--celadon);
    color: #0e1615;
    font-weight: 600;
  }

  .primary:hover:not(:disabled) { background: #9ac8b9; }

  .hint {
    font-size: 12px;
    line-height: 1.5;
    color: var(--paper-dim);
    min-height: 2.6em;
    margin: 0;
  }

  .hint.warn { color: var(--brass); }

  .log {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--paper-dim);
    min-height: 60px;
    border-top: 1px solid var(--field-edge);
    padding-top: 12px;
  }

  .log b { color: var(--paper); font-weight: 500; }

  /* ---------------------------------------------------------- 결과 */

  .result {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--ink) 72%, transparent);
    backdrop-filter: blur(2px);
  }

  .result[hidden] { display: none; }

  .result-card {
    text-align: center;
    padding: 28px 34px;
    border: 1px solid var(--field-edge);
    border-radius: var(--radius);
    background: var(--rail);
  }

  .result-card h2 {
    font-family: var(--font-display);
    font-size: 30px;
    margin: 0 0 6px;
    letter-spacing: 0.04em;
  }

  .result-card p {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--paper-dim);
  }

  @keyframes drop {
    from { transform: translateY(-6px) scale(0.7); opacity: 0; }
    to { transform: none; opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .token { animation: none; }
  }

  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .rail {
      border-left: none;
      border-top: 1px solid var(--field-edge);
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
      gap: 12px;
    }
    .log { display: none; }
    .board-wrap { padding: 10px; }
    .bank-row { display: flex; gap: 22px; align-items: flex-start; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="wordmark">육목</h1>
  <span class="tagline">19줄 판. 여섯 개를 잇는 쪽이 이긴다. 돌은 턴마다 두 개씩 들어온다.</span>
  <div class="topbar-controls">
    <span class="badge" id="ai-badge" title="지금 상대를 맡고 있는 쪽">규칙 기반 AI</span>
    <select id="level" aria-label="난이도">
      <option value="easy">쉬움</option>
      <option value="normal" selected>보통</option>
      <option value="hard">어려움</option>
    </select>
    <select id="side" aria-label="내 색">
      <option value="1">흑으로 두기</option>
      <option value="2">백으로 두기</option>
    </select>
    <button id="new-game">새 판</button>
  </div>
</header>

<main class="stage">
  <div class="board-wrap">
    <canvas id="board" tabindex="0" aria-label="게임판. 화살표 키로 자리를 옮기고 엔터로 둡니다."></canvas>
    <div class="result" id="result" hidden>
      <div class="result-card">
        <h2 id="result-title">흑 승리</h2>
        <p id="result-detail"></p>
        <button class="primary" id="result-new">새 판</button>
      </div>
    </div>
  </div>

  <aside class="rail">
    <div>
      <p class="label">차례</p>
      <div class="turn-line">
        <span class="turn-dot" id="turn-dot"></span>
        <span id="turn-text">흑 차례</span>
      </div>
    </div>

    <div class="bank-row">
      <div class="bank" id="bank">
        <p class="label">돌 창고</p>
        <div class="bank-line" id="bank-mine"></div>
        <div class="bank-line" id="bank-theirs"></div>
        <p class="burst-note">세 개를 몰아 둘 수 있습니다.</p>
      </div>

      <div>
        <p class="label">이번 턴</p>
        <div class="slots" id="slots"></div>
      </div>
    </div>

    <div class="actions">
      <button id="undo">무르기</button>
      <button class="primary" id="end-turn">턴 마치기</button>
    </div>

    <p class="hint" id="hint"></p>

    <div class="log" id="log" aria-live="polite"></div>
  </aside>
</main>

<!-- 게임 엔진. 예전에는 이 파일 안에 복사돼 있었는데, 고칠 때마다 두 군데를
     맞춰야 해서 실수가 잦았다. 이제 engine.js 하나만 고치면 된다. -->
<script src="engine.js"></script>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------------- 상태 */

  const el = (id) => document.getElementById(id);
  const canvas = el('board');
  const ctx = canvas.getContext('2d');

  /* 판은 19줄로 고정한다. 학습 모델의 정책 출력이 19×19+1 크기에 맞춰져 있어서
     판 크기를 바꾸면 모델을 다시 학습시켜야 한다.
     엔진(SixMok)과 game.py 자체는 19~25줄을 모두 지원하므로,
     크기를 열고 싶다면 여기 상수와 신경망 마지막 층만 손보면 된다. */
  const BOARD_SIZE = 19;

  let game = null;
  let humanColor = BLACK;
  let aiLevel = 'normal';
  let turnStart = null;      // 사람 턴 시작 시점의 스냅샷 (무르기용)
  let busy = false;          // AI가 두는 동안 입력 차단
  let hover = null;          // 마우스 미리보기 좌표
  let cursor = null;         // 키보드 커서 좌표
  let logLines = [];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia('(pointer: fine)').matches;
  const colorName = { [BLACK]: '흑', [WHITE]: '백' };
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));

  /* ------------------------------------------------------- 모델을 붙일 자리 */

  /* 학습한 모델은 window.MODEL_PLAN_TURN 으로 붙인다.
     인터페이스: async (game) => [[행, 열], ...]  (빈 배열이면 이번 턴은 쉬고 돌을 모은다)
     game 객체로 game.at(r,c), game.stones, game.canPlace() 등을 읽을 수 있다.
     난이도는 window.AI_LEVEL() 로 읽어간다 (모델 쪽에서는 temperature 로 쓴다).
     붙이기 전까지는 아래 규칙 기반 AI가 상대를 맡는다. */
  window.AI_LEVEL = () => AI_LEVELS[aiLevel] || AI_LEVELS.normal;

  let modelHasPlayed = false;   // 모델이 실제로 한 턴이라도 뒀는지

  async function planAiTurn(g) {
    if (typeof window.MODEL_PLAN_TURN === 'function') {
      try {
        const moves = await window.MODEL_PLAN_TURN(g);
        modelHasPlayed = true;
        updateBadge();
        return moves;
      } catch (err) {
        console.warn('모델 호출 실패, 규칙 기반 AI로 대신합니다.', err);
        window.MODEL_STATUS = 'failed';
        window.MODEL_STATUS_DETAIL = err.message;
        updateBadge();
      }
    }
    return planTurn(g, window.AI_LEVEL());
  }

  /* 지금 상대가 학습 모델인지 규칙 기반 AI인지 화면에 드러낸다.
     모델을 붙였는데 조용히 규칙 기반으로 되돌아가는 경우를 눈으로 잡기 위한 것이다. */
  function aiStatus() {
    if (typeof window.MODEL_PLAN_TURN !== 'function') {
      return { label: '규칙 기반 AI', tone: '', detail: 'model.js 를 불러오지 않았습니다.' };
    }
    switch (window.MODEL_STATUS) {
      case 'ready':
        return modelHasPlayed
          ? { label: '학습 모델', tone: 'model', detail: '모델이 상대를 맡고 있습니다.' }
          : { label: '학습 모델 대기', tone: 'model', detail: '모델을 불러왔습니다. 첫 수를 두면 확정됩니다.' };
      case 'failed':
        return { label: '규칙 기반 AI · 모델 실패', tone: 'error',
                 detail: window.MODEL_STATUS_DETAIL || '모델을 불러오지 못했습니다.' };
      default:
        return { label: '모델 불러오는 중', tone: 'loading', detail: '' };
    }
  }

  function updateBadge() {
    const badge = el('ai-badge');
    if (!badge) return;
    const status = aiStatus();
    badge.textContent = status.label;
    badge.className = 'badge' + (status.tone ? ' ' + status.tone : '');
    badge.title = status.detail;
  }

  window.addEventListener('model-status', updateBadge);
  window.__aiStatus = aiStatus;

  /* ---------------------------------------------------------------- 그리기 */

  let geom = { pad: 0, cell: 0, px: 0 };

  function resize() {
    const wrap = canvas.parentElement;
    const style = getComputedStyle(wrap);
    const availW = wrap.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const availH = wrap.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    const size = Math.max(200, Math.floor(Math.min(availW, availH)));

    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const n = game.size;
    const margin = Math.max(14, size * 0.035);
    geom.cell = (size - margin * 2) / (n - 1);
    geom.pad = margin;
    geom.px = size;
    draw();
  }

  const xy = (r, c) => [geom.pad + c * geom.cell, geom.pad + r * geom.cell];

  function stoneRadius() { return geom.cell * 0.44; }

  function drawStone(r, c, color, alpha = 1) {
    const [x, y] = xy(r, c);
    const rad = stoneRadius();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y + rad * 0.12, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    const grad = ctx.createRadialGradient(x - rad * 0.3, y - rad * 0.35, rad * 0.1, x, y, rad);
    if (color === BLACK) { grad.addColorStop(0, '#4a5350'); grad.addColorStop(1, '#0d1110'); }
    else { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#bcb4a3'); }
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const n = game.size;
    const size = geom.px;
    if (!size) return;

    ctx.clearRect(0, 0, size, size);

    // 판
    ctx.fillStyle = getCss('--field');
    roundRect(0, 0, size, size, 10);
    ctx.fill();

    // 격자
    ctx.strokeStyle = getCss('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const [x0, y0] = xy(i, 0);
      const [x1, y1] = xy(i, n - 1);
      ctx.moveTo(crisp(geom.pad), crisp(y0));
      ctx.lineTo(crisp(x1), crisp(y1));
      const [cx0, cy0] = xy(0, i);
      const [cx1, cy1] = xy(n - 1, i);
      ctx.moveTo(crisp(cx0), crisp(cy0));
      ctx.lineTo(crisp(cx1), crisp(cy1));
    }
    ctx.stroke();

    // 화점
    const marks = [3, (n - 1) / 2, n - 4].filter((v) => Number.isInteger(v));
    ctx.fillStyle = getCss('--line');
    for (const r of marks) {
      for (const c of marks) {
        const [x, y] = xy(r, c);
        ctx.beginPath();
        ctx.arc(x, y, Math.max(2, geom.cell * 0.09), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 돌
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const v = game.at(r, c);
        if (v !== EMPTY) drawStone(r, c, v);
      }
    }

    // 이번 턴에 놓인 돌 표시
    ctx.strokeStyle = getCss('--celadon');
    ctx.lineWidth = 1.6;
    for (const [r, c] of game.lastPlaced) {
      const [x, y] = xy(r, c);
      ctx.beginPath();
      ctx.arc(x, y, stoneRadius() * 0.42, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 승리 라인
    if (game.winningLine) {
      ctx.strokeStyle = getCss('--celadon');
      ctx.lineWidth = 2.4;
      for (const [r, c] of game.winningLine) {
        const [x, y] = xy(r, c);
        ctx.beginPath();
        ctx.arc(x, y, stoneRadius() * 1.12, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // 미리보기
    const preview = hover || cursor;
    if (preview && !busy && !game.isOver && game.current === humanColor
        && game.at(preview[0], preview[1]) === EMPTY && game.canPlace()) {
      drawStone(preview[0], preview[1], humanColor, 0.42);
    }
    if (cursor) {
      const [x, y] = xy(cursor[0], cursor[1]);
      ctx.strokeStyle = getCss('--celadon');
      ctx.lineWidth = 1.4;
      ctx.strokeRect(crisp(x - geom.cell * 0.5), crisp(y - geom.cell * 0.5), geom.cell, geom.cell);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const crisp = (v) => Math.round(v) + 0.5;
  const cssCache = {};
  function getCss(name) {
    if (!cssCache[name]) {
      cssCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    return cssCache[name];
  }

  /* ---------------------------------------------------------------- 화면 갱신 */

  function render() {
    draw();
    const mine = game.current === humanColor;

    el('turn-dot').style.background = game.current === BLACK
      ? 'radial-gradient(circle at 34% 30%, #4a5350, #0d1110 70%)'
      : 'radial-gradient(circle at 34% 30%, #fff, #bdb5a4 72%)';
    el('turn-text').textContent = game.isOver
      ? '대국 종료'
      : `${colorName[game.current]} 차례 — ${mine ? '내 턴' : 'AI 턴'}`;

    // 돌 창고 — 내 것과 상대 것을 함께 보여준다
    const foeColor = humanColor === BLACK ? WHITE : BLACK;
    updateBankLine(el('bank-mine'), humanColor, '나', game.current === humanColor);
    updateBankLine(el('bank-theirs'), foeColor, '상대', game.current === foeColor);
    el('bank').classList.toggle(
      'burst',
      game.current === humanColor && game.stones[humanColor] >= game.config.maxPlacesPerTurn
    );

    // 이번 턴 슬롯
    const stones = game.stones[game.current];
    const slots = el('slots');
    slots.textContent = '';
    for (let i = 0; i < game.config.maxPlacesPerTurn; i++) {
      const s = document.createElement('span');
      s.className = 'slot';
      if (i < game.placedThisTurn) s.classList.add('filled');
      else if (i >= game.placedThisTurn + stones) s.classList.add('locked');
      slots.appendChild(s);
    }

    el('end-turn').disabled = busy || game.isOver || !mine;
    el('undo').disabled = busy || game.isOver || !mine || game.placedThisTurn === 0;

    el('log').innerHTML = logLines.slice(-40).join('<br>');
    el('log').scrollTop = el('log').scrollHeight;

    updateBadge();

    if (game.isOver) showResult();
  }

  const bankKeys = {};

  function updateBankLine(node, color, who, active) {
    const stones = game.stones[color];
    const key = `${stones}|${active}`;
    node.classList.toggle('active', active);
    if (bankKeys[color] === key) return;   // 개수가 그대로면 다시 그리지 않는다
    bankKeys[color] = key;

    node.textContent = '';
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = who;
    node.appendChild(label);

    for (let i = 0; i < Math.min(stones, 8); i++) {
      const t = document.createElement('span');
      t.className = 'token ' + (color === BLACK ? 'black' : 'white');
      node.appendChild(t);
    }

    const count = document.createElement('span');
    count.className = 'bank-count';
    if (stones >= game.config.maxPlacesPerTurn) count.classList.add('ready');
    count.textContent = `${stones}개`;
    node.appendChild(count);
  }

  function setHint(text, warn = false) {
    const h = el('hint');
    h.textContent = text;
    h.classList.toggle('warn', warn);
  }

  function defaultHint() {
    if (game.isOver) return setHint('');
    if (game.current !== humanColor) return setHint('AI가 생각하는 중입니다.');
    const stones = game.stones[humanColor];
    const foeStones = game.stones[humanColor === BLACK ? WHITE : BLACK];
    if (stones === 0 && game.placedThisTurn === 0) {
      return setHint('둘 돌이 없습니다. 턴을 마치면 두 개를 받습니다.');
    }
    if (!game.canPlace()) return setHint('턴을 마치면 돌 두 개를 받습니다.');
    if (foeStones >= game.config.maxPlacesPerTurn) {
      return setHint('상대가 다음 턴에 세 개를 몰아 둘 수 있습니다.', true);
    }
    if (game.placedThisTurn === 0 && stones < 3) {
      return setHint('지금 턴을 그냥 마치면 돌이 쌓입니다. 세 개가 모이면 한 턴에 몰아 둘 수 있습니다.');
    }
    return setHint('');
  }

  let resultShown = false;
  function showResult() {
    if (resultShown) return;
    resultShown = true;
    const title = game.winner ? `${colorName[game.winner]} 승리` : '무승부';
    el('result-title').textContent = title;
    el('result-detail').textContent = game.winner
      ? (game.winner === humanColor ? '여섯 개를 이었습니다.' : 'AI가 여섯 개를 이었습니다.')
      : `판의 70%가 채워졌습니다. (${game.stonesOnBoard}개)`;
    setTimeout(() => { el('result').hidden = false; }, reduceMotion ? 0 : 900);
  }

  /* ---------------------------------------------------------------- 입력 */

  function pointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = Math.round((x - geom.pad) / geom.cell);
    const r = Math.round((y - geom.pad) / geom.cell);
    if (!game.inside(r, c)) return null;
    const [px, py] = xy(r, c);
    if (Math.hypot(px - x, py - y) > geom.cell * 0.55) return null;
    return [r, c];
  }

  function humanPlace(r, c) {
    if (busy || game.isOver || game.current !== humanColor) return;
    if (!game.canPlace()) {
      setHint(game.stones[humanColor] === 0
        ? '이번 턴에 둘 돌이 없습니다. 턴을 마치세요.'
        : '한 턴에 세 개까지만 둘 수 있습니다. 턴을 마치세요.', true);
      return;
    }
    try {
      game.place(r, c);
    } catch (err) {
      setHint(err.message, true);
      return;
    }
    defaultHint();
    if (game.isOver) {
      logTurn(humanColor, game.lastPlaced);
      finishLog();
    }
    render();
  }

  canvas.addEventListener('click', (e) => {
    const p = pointFromEvent(e);
    if (p) humanPlace(p[0], p[1]);
  });

  if (finePointer) {
    canvas.addEventListener('mousemove', (e) => {
      const p = pointFromEvent(e);
      const changed = (!p !== !hover) || (p && hover && (p[0] !== hover[0] || p[1] !== hover[1]));
      hover = p;
      if (changed) draw();
    });
    canvas.addEventListener('mouseleave', () => { hover = null; draw(); });
  }

  canvas.addEventListener('keydown', (e) => {
    const n = game.size;
    if (!cursor) cursor = [Math.floor(n / 2), Math.floor(n / 2)];
    const step = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (step) {
      cursor = [
        Math.min(n - 1, Math.max(0, cursor[0] + step[0])),
        Math.min(n - 1, Math.max(0, cursor[1] + step[1])),
      ];
      e.preventDefault();
      draw();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      humanPlace(cursor[0], cursor[1]);
    }
  });

  el('end-turn').addEventListener('click', () => {
    if (busy || game.isOver || game.current !== humanColor) return;
    logTurn(humanColor, game.lastPlaced);
    game.endTurn();
    render();
    runAiTurn();
  });

  el('undo').addEventListener('click', () => {
    if (!turnStart || busy) return;
    game.restore(turnStart);
    setHint('이번 턴에 둔 돌을 되돌렸습니다.');
    render();
  });

  el('new-game').addEventListener('click', newGame);
  el('result-new').addEventListener('click', newGame);
  el('side').addEventListener('change', newGame);
  el('level').addEventListener('change', () => {
    aiLevel = el('level').value;
    setHint(`난이도를 ${window.AI_LEVEL().label}(으)로 바꿨습니다. 다음 수부터 적용됩니다.`);
  });

  /* ---------------------------------------------------------------- 진행 */

  function logTurn(color, moves) {
    const where = moves.length
      ? moves.map(([r, c]) => `${r + 1}·${c + 1}`).join('  ')
      : '쉼 (돌 모으기)';
    logLines.push(`<b>${colorName[color]}</b> ${where}`);
  }

  function finishLog() {
    logLines.push(game.winner ? `— ${colorName[game.winner]} 승리` : '— 무승부');
  }

  async function runAiTurn() {
    if (game.isOver || game.current === humanColor) { afterTurn(); return; }
    busy = true;
    render();
    await sleep(320);
    const moves = await planAiTurn(game);
    const placed = [];
    for (const [r, c] of moves) {
      if (!game.canPlace()) break;
      game.place(r, c);
      placed.push([r, c]);
      render();
      if (game.isOver) break;
      await sleep(240);
    }
    logTurn(game.current, placed);
    if (!game.isOver) game.endTurn();
    else finishLog();
    busy = false;
    afterTurn();
  }

  function afterTurn() {
    turnStart = game.isOver ? null : game.snapshot();
    defaultHint();
    render();
  }

  function newGame() {
    humanColor = parseInt(el('side').value, 10);
    game = new SixMok({ boardSize: BOARD_SIZE });
    logLines = [];
    hover = null;
    cursor = null;
    busy = false;
    resultShown = false;
    bankKeys[BLACK] = bankKeys[WHITE] = null;
    el('result').hidden = true;
    resize();
    if (game.current === humanColor) {
      afterTurn();
    } else {
      render();
      runAiTurn();
    }
  }

  window.addEventListener('resize', () => resize());
  window.addEventListener('load', () => resize());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => resize());
  newGame();

  // 콘솔에서 실험할 수 있게 열어둔다
  window.__game = () => game;
})();
</script>

     상단 배지에 지금 어느 쪽이 두고 있는지 표시됩니다. -->
